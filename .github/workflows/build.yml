# Builds the standalone kol-ble-pairing executable on Linux, macOS and
# Windows. Every run uploads them as workflow artifacts; pushing a tag
# v* also publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binary is built in a container (build-container.sh,
          # Debian bullseye, glibc 2.31), so the runner's glibc does not
          # matter.
          - os: ubuntu-latest
            asset: kol-ble-pairing-linux-x64
          - os: macos-latest
            asset: kol-ble-pairing-macos-arm64
          - os: windows-latest
            asset: kol-ble-pairing-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (Linux, in a podman container)
        if: runner.os == 'Linux'
        run: ./build-container.sh

      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test
        shell: bash
        run: |
          exe=dist/kol-ble-pairing
          [ "$RUNNER_OS" = Windows ] && exe=dist/kol-ble-pairing.exe
          "$exe" --help
          "$exe" --version
          # A release tag must match VERSION in kol_ble_pairing.py.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$("$exe" --version)" != "kol-ble-pairing ${GITHUB_REF_NAME#v}" ]; then
            echo "tag $GITHUB_REF_NAME does not match $("$exe" --version)"; exit 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            objdump -T "$exe" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          fi

      # A tarball keeps the executable bit on Linux and macOS; artifacts
      # and release assets would otherwise drop it.
      # Names carry the version the executable reports, e.g.
      # kol-ble-pairing-1.2.0-linux-x64.tar.gz.
      - name: Package
        id: package
        shell: bash
        run: |
          exe=dist/kol-ble-pairing
          [ "$RUNNER_OS" = Windows ] && exe=dist/kol-ble-pairing.exe
          version=$("$exe" --version | awk '{print $2}' | tr -d '\r')
          name="kol-ble-pairing-$version-${MATRIX_ASSET#kol-ble-pairing-}"
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$exe" "out/$name.exe"
          else
            tar -czf "out/$name.tar.gz" -C dist kol-ble-pairing
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          MATRIX_ASSET: ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
